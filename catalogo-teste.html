
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SABOTZ | Catalogue Test</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 20px;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1150px;
      margin: auto;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 35px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: #171717;
      padding-bottom: 20px;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .details {
      padding: 16px;
    }

    .category {
      color: #999;
      font-size: 11px;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 18px;
      margin: 12px 0;
    }

    .status {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .notice {
      margin-top: 35px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SABOTZ. COLLECTION</h1>
    <p class="subtitle">Selected products · Catalogue preview</p>

    <div class="grid" id="products"></div>

    <p class="notice">
      Internal catalogue test. Products shown are not offered for sale.
    </p>
  </div>

  <script>
    async function carregarProdutos() {
      const container = document.getElementById("products");

      try {
        const resposta = await fetch("catalogo/produtos.json");

        if (!resposta.ok) {
          throw new Error("Could not load catalogue");
        }

        const dados = await resposta.json();

        dados.produtos.forEach(produto => {
          const card = document.createElement("div");
          card.className = "card";

          const foto = document.createElement("img");
          foto.src = produto.fotos[0];
          foto.alt = produto.nome;

          const details = document.createElement("div");
          details.className = "details";

          const category = document.createElement("div");
          category.className = "category";
          category.textContent = produto.categoria;

          const nome = document.createElement("h2");
          nome.textContent = produto.nome;

          const status = document.createElement("div");
          status.className = "status";
          status.textContent = produto.status;

          details.append(category, nome, status);
          card.append(foto, details);
          container.appendChild(card);
        });

      } catch (erro) {
        container.textContent =
          "Could not load catalogue. Start the local server first.";
        console.error(erro);
      }
    }

    carregarProdutos();
  </script>

</body>
</html>
