server.port=${PORT:3000}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=sabotz.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/sabotz;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=101MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${WELCOME_GMAIL_USER:}
spring.mail.password=${WELCOME_GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
sabotz.admin.username=${ADMIN_USERNAME}
sabotz.admin.password=${ADMIN_PASSWORD}
