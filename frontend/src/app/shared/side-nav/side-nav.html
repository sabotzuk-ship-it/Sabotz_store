<button class="menu-button" type="button" [attr.aria-label]="open ? 'Close menu' : 'Open menu'" [attr.aria-expanded]="open" aria-controls="site-menu" (click)="open = !open"><span [hidden]="open">&#9776;</span><span [hidden]="!open">&#215;</span></button>
<button class="menu-backdrop" [class.open]="open" type="button" aria-label="Close menu" (click)="open = false"></button>
<nav id="site-menu" class="menu" [class.open]="open" aria-label="Main navigation">
  <a routerLink="/" (click)="open = false">HOME</a>
  <a routerLink="/collection" (click)="open = false">ALL PIECES</a>
  <a *ngFor="let category of settings.categories" [routerLink]="['/categories', category.id]" (click)="open = false">{{ category.title }} <span *ngIf="category.comingSoon">· COMING SOON</span></a>
  <app-social-links [stacked]="true" />
</nav>
