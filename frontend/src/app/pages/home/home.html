<div class="home-page">
  <header class="site-header">
    <a routerLink="/" class="logo">SABOTZ.</a>
    <app-side-nav />
  </header>

  <main class="categories">
    <a *ngFor="let category of settings.categories" [routerLink]="['/categories', category.id]" class="category">
      <img [src]="categoryImageUrl(category.image)" [alt]="'Explore ' + category.title">
      <span class="coming-soon-badge" *ngIf="category.comingSoon">EM BREVE</span>
      <div class="category-content"><div><h2>{{ category.title }}</h2><p>{{ category.subtitle }}</p></div><span class="arrow">&#8599;</span></div>
    </a>
  </main>

  <footer>SABOTZ CLOTHING &amp; SUPPLY</footer>
</div>
