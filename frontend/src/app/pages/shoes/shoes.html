<div class="container">
  <header>
    <a class="logo" routerLink="/">SABOTZ.</a>
    <a class="back" routerLink="/">&#8592; BACK TO HOME</a>
    <app-side-nav />
  </header>
  <main>
    <h1>SHOES.</h1>
    <p class="subtitle">EXPLORE OUR SNEAKER COLLECTION</p>
    <app-catalog-filters [products]="products" #catalogFilters />
    <div class="products">
      <article class="product" *ngFor="let product of catalogFilters.visibleProducts">
        <img [storeImage]="'/' + product.fotos[0]" storeImageSizes="(max-width: 450px) 100vw, (max-width: 750px) 50vw, 350px" [alt]="product.nome" loading="lazy">
        <div class="details">
          <div class="brand">{{ product.marca.toUpperCase() }}</div>
          <div class="name">{{ product.nome }}</div>
          <div class="price" *ngIf="product.preco !== undefined">{{ formatPrice(product.preco) }}</div>
          <div class="status">{{ product.status }}</div>
          <a class="view" [routerLink]="['/products', productSlug(product)]">VIEW GALLERY <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a>
        </div>
      </article>
    </div>
    <p class="empty" *ngIf="!error && !products.length">No products available in this collection yet.</p>
    <p class="empty" *ngIf="error">{{ error }}</p>

  </main>
  <footer>SABOTZ CLOTHING &amp; SUPPLY</footer>
</div>
