
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SABOTZ | Clothing & Supply</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #0c0c0c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      max-width: 1100px;
      margin: auto;
      padding: 30px 22px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 31px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .menu-button {
      background: none;
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .menu {
      display: none;
      background: #191919;
      padding: 20px;
      text-align: center;
    }

    .menu.open {
      display: block;
    }

    .menu a {
      display: block;
      padding: 12px;
      font-size: 14px;
    }

    .categories {
      max-width: 1100px;
      margin: auto;
      padding: 0 16px 40px;
      display: grid;
      gap: 16px;
    }

    .category {
      position: relative;
      display: block;
      height: 310px;
      overflow: hidden;
      border-radius: 5px;
      background: #222;
    }

    .category img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .category:hover img {
      transform: scale(1.04);
    }

    .category::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 35%,
        rgba(0, 0, 0, 0.85)
      );
    }

    .category-content {
      position: absolute;
      bottom: 24px;
      left: 22px;
      right: 22px;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
    }

    .category h2 {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .category p {
      margin: 8px 0 0;
      color: #ddd;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .arrow {
      font-size: 32px;
      font-weight: 300;
    }

    footer {
      padding: 30px;
      text-align: center;
      color: #888;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (min-width: 850px) {
      .site-header {
        padding-top: 40px;
      }

      .categories {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .category {
        height: 480px;
      }

      .category h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">SABOTZ.</a>

    <button class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            onclick="toggleMenu()">
      &#9776;
    </button>
  </header>

  <nav id="site-menu" class="menu">
    <a href="index.html">HOME</a>
    <a href="shoes.html">SHOES</a>
    <a href="clothing.html">CLOTHING</a>
    <a href="accessories.html">ACCESSORIES</a>
    <a href="https://www.instagram.com/sabotz.clothing/"
       target="_blank" rel="noopener noreferrer">
      INSTAGRAM
    </a>
  </nav>

  <main class="categories">

    <a href="shoes.html" class="category">
      <img src="assets/images/shoes.jpg"
           alt="Explore sneakers"
           onerror="this.style.display='none'">

      <div class="category-content">
        <div>
          <h2>SHOES</h2>
          <p>EXPLORE SNEAKERS</p>
        </div>
        <span class="arrow">&#8599;</span>
      </div>
    </a>

    <a href="clothing.html" class="category">
      <img src="assets/images/clothing.jpg"
           alt="Explore clothing"
           onerror="this.style.display='none'">

      <div class="category-content">
        <div>
          <h2>JACKETS & CLOTHING</h2>
          <p>HOODIES. TRACKSUITS. T-SHIRTS.</p>
        </div>
        <span class="arrow">&#8599;</span>
      </div>
    </a>

    <a href="accessories.html" class="category">
      <img src="assets/images/accessories.jpg"
           alt="Explore accessories"
           onerror="this.style.display='none'">

      <div class="category-content">
        <div>
          <h2>ACCESSORIES</h2>
          <p>SUNGLASSES. BAGS. MORE.</p>
        </div>
        <span class="arrow">&#8599;</span>
      </div>
    </a>

  </main>

  <footer>
    SABOTZ CLOTHING & SUPPLY &middot; <a href="admin.html">ADMIN</a>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('site-menu');
      const button = document.querySelector('.menu-button');

      const isOpen = menu.classList.toggle('open');

      button.setAttribute('aria-expanded', String(isOpen));
    }
  </script>

</body>
</html>
